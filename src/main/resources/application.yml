spring:
  application:
    name: ecommerce-ai-agent-service
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/work_memory?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: deepseek-chat
      temperature: 0.1
      max-retries: 2
      timeout: 30s

server:
  port: 8099

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

ai:
  knowledge:
    chroma-base-url: ${CHROMA_BASE_URL:http://localhost:8000}
    finance-collection: ${FINANCE_CHROMA_COLLECTION:finance-knowledge-bge-m3-v1}
    embedding-base-url: ${OLLAMA_BASE_URL:http://100.92.110.54:11434}
    embedding-model-name: ${EMBEDDING_MODEL_NAME:bge-m3}
    chunk-size: 800
    chunk-overlap: 100
    resource-pattern: classpath*:*.md
    bm25-index-path: ${BM25_INDEX_PATH:./data/lucene/knowledge}
    rrf-k: 60
    reranker-base-url: ${RERANKER_BASE_URL:http://localhost:8081}
    reranker-enabled: ${RERANKER_ENABLED:true}
    reranker-timeout-seconds: 30
    query-rewriter-base-url: ${QUERY_REWRITER_BASE_URL:${OLLAMA_BASE_URL:http://100.92.110.54:11434}}
    query-rewriter-model-name: ${QUERY_REWRITER_MODEL_NAME:qwen2.5:3b}
    query-rewriter-enabled: ${QUERY_REWRITER_ENABLED:true}
    query-rewriter-timeout-seconds: ${QUERY_REWRITER_TIMEOUT_SECONDS:30}
    query-rewriter-max-rewrites: ${QUERY_REWRITER_MAX_REWRITES:3}
